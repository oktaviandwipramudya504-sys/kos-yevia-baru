<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Penghuni - Kos Yevia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }</style>
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" href="/"><i class="fa-solid fa-hotel me-2"></i>Kos Yevia</a>
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Kembali</a>
        </div>
    </nav>
    <div class="container py-4">
        <h4 class="fw-bold mb-3">Data Penghuni Kos</h4>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white sticky-top" style="top: 80px;">
                    <h6 class="fw-bold mb-3 text-success"><i class="fa-solid fa-user-plus me-1"></i> Input Penghuni Baru</h6>
                    <form method="POST">
                        <div class="mb-2">
                            <label class="form-label small text-muted">Nama Lengkap</label>
                            <input type="text" class="form-control form-control-sm" name="nama" placeholder="Nama penghuni" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small text-muted">Pilih Kamar</label>
                            <select class="form-select form-select-sm" name="kamar" required>
                                <option value="" disabled selected>-- Pilih Kamar --</option>
                                {% for k in kamar_list %}
                                    {% if k.status == 'Kosong' %}
                                        <option value="{{ k.nomor }}">{{ k.nomor }}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small text-muted">No. WhatsApp / Telepon</label>
                            <input type="text" class="form-control form-control-sm" name="telepon" placeholder="Cth: 08123456789" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Tanggal Masuk</label>
                            <input type="text" class="form-control form-control-sm" name="masuk" placeholder="Cth: 10 Aug 2026" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-sm w-100 fw-semibold">Simpan Penghuni</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                    <div class="p-3 border-bottom bg-light">
                        <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-users me-1"></i> Daftar Penghuni Aktif</h6>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-light small">
                                <tr>
                                    <th class="ps-3 py-3">Nama Penghuni</th>
                                    <th class="py-3">Kamar</th>
                                    <th class="py-3">No. WhatsApp</th>
                                    <th class="py-3">Tgl Masuk</th>
                                    <th class="py-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% if daftar %}
                                    {% for p in daftar %}
                                    <tr>
                                        <td class="ps-3 fw-semibold">{{ p.nama }}</td>
                                        <td><span class="badge bg-primary bg-opacity-15 text-primary px-2 py-1">{{ p.kamar }}</span></td>
                                        <td>
                                            <a href="https://wa.me/{{ p.telepon }}" target="_blank" class="text-decoration-none text-success fw-semibold">
                                                <i class="fa-brands fa-whatsapp me-1"></i> {{ p.telepon }}
                                            </a>
                                        </td>
                                        <td class="text-muted small">{{ p.masuk }}</td>
                                        <td class="text-center">
                                            <a href="{{ url_for('hapus_penghuni', penghuni_id=p.id) }}" class="btn btn-outline-danger btn-sm py-0 px-2" onclick="return confirm('Yakin ingin menghapus penghuni ini? Kamar akan otomatis menjadi kosong.')">
                                                <i class="fa-solid fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    {% endfor %}
                                {% else %}
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-muted small">Belum ada data penghuni yang diinput.</td>
                                    </tr>
                                {% endif %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
