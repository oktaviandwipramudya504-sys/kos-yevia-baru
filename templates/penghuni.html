<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manajemen Penghuni - Kos Yevia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Kos Yevia</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/kamar">Kamar</a></li>
            <li class="nav-item"><a class="nav-link active" href="/penghuni">Penghuni</a></li>
            <li class="nav-item"><a class="nav-link" href="/keuangan">Keuangan</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4 fw-bold">Manajemen Penghuni</h2>

        <!-- Form Tambah Penghuni -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Check-in Penghuni Baru</h5>
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" name="nama" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Pilih Kamar Kosong</label>
                            <select name="kamar" class="form-select" required>
                                <option value="" disabled selected>Pilih Kamar</option>
                                {% for k in kamar_list %}
                                    {% if k.status == 'Kosong' %}
                                        <option value="{{ k.nomor }}">Kamar {{ k.nomor }}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">No. Telepon/WA</label>
                            <input type="text" name="telepon" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Tanggal Masuk</label>
                            <input type="date" name="masuk" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Check-in Penghuni</button>
                </form>
            </div>
        </div>

        <!-- Tabel Daftar Penghuni -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nama</th>
                                <th>Kamar</th>
                                <th>Telepon</th>
                                <th>Tanggal Masuk</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for p in daftar %}
                            <tr>
                                <td class="fw-bold">{{ p.nama }}</td>
                                <td>Kamar {{ p.kamar }}</td>
                                <td>{{ p.telepon }}</td>
                                <td>{{ p.masuk }}</td>
                                <td>
                                    <a href="/penghuni/hapus/{{ p.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Penghuni check-out? Status kamar akan otomatis jadi kosong.')">Check-out</a>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="5" class="text-center text-muted">Belum ada penghuni aktif.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
