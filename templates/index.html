<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Kos Yevia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar Responsif Ponsel -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Kos Yevia</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="/">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/kamar">Kamar</a></li>
            <li class="nav-item"><a class="nav-link" href="/penghuni">Penghuni</a></li>
            <li class="nav-item"><a class="nav-link" href="/keuangan">Keuangan</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4 fw-bold">Dashboard</h2>
        
        <!-- Kartu Statistik -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted">Total Kamar</h6>
                    <h3 class="fw-bold mb-0">{{ total }}</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted">Terisi</h6>
                    <h3 class="fw-bold text-success mb-0">{{ terisi }}</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted">Kosong</h6>
                    <h3 class="fw-bold text-warning mb-0">{{ kosong }}</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted">Saldo Kas</h6>
                    <h5 class="fw-bold text-primary mb-0 mt-1">Rp {{ "{:,}".format(saldo).replace(',', '.') }}</h5>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
